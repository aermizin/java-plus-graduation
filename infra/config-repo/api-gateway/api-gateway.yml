server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8443
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600

      routes:
        - id: main-service
          uri: lb://main-service
          predicates:
            - Path=/categories,/categories/**,/compilations,/compilations/**,/users,/users/**,/events,/events/**,/admin/**

management:
  endpoints:
    web:
      exposure:
        include: gateway,health
  endpoint:
    gateway:
      enabled: true
      access: read-only

logging:
  level:
    org.springframework.cloud.loadbalancer: TRACE
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG
services:
  stats-db:
    image: postgres:16.1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: stats-db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345

  ewm-db:
    image: postgres:16.1
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ewm-db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
